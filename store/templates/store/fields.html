{{ form.non_field_errors }}
{% for field in form %}
  <div class="field{% if field.name == 'address' or field.name == 'full_name' %} field-wide{% endif %}">
    {{ field.label_tag }}
    {% if field.field.widget.input_type == 'password' %}
      <div class="password-field">{{ field }}<button type="button" data-password aria-pressed="false">Mostrar</button></div>
    {% else %}
      {{ field }}
    {% endif %}
    {{ field.errors }}
    {% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  </div>
{% endfor %}
