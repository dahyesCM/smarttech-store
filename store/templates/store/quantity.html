<div class="stepper" data-stepper>
  <button type="button" data-step="-1" aria-label="Disminuir cantidad de {{ name }}">−</button>
  <input type="number" name="quantity" value="{{ quantity }}" min="1" max="99" required aria-label="Cantidad de {{ name }}">
  <button type="button" data-step="1" aria-label="Aumentar cantidad de {{ name }}">+</button>
</div>
